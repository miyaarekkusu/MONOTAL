<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <link rel="stylesheet" type="text/css" href="css/common.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo-section">

            </div>
            <div class="search-section">
                <form class="search-form">
                    <input type="text" class="search-input" placeholder="なにをお探しですか？">
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>
            <div class="user-actions">
                <a href="community.html" class="action-link community-btn">コミュニティ</a>

                <a href="register.html" class="action-link">会員登録</a>

                    <i class="fas fa-bell"></i>
                </a>
                <a href="profile.html" class="action-icon">
                    <i class="fas fa-user"></i>
                </a>
                <a href="/bookmarks" class="action-icon">
                    <i class="fas fa-heart"></i>
                </a>
                <a href="sell.html" class="sell-btn-header">出品</a>

    <nav class="main-nav">

            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="/">おすすめ</a>

                </li>
                <li class="nav-item">
                    <a href="/category/ladies">レディース</a>
                </li>
                <li class="nav-item">
                    <a href="/category/baby">ベビー・キッズ</a>
                </li>
            </ul>
        </div>
    </nav>
    <main>
    </main>
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-credit">
                    <p>&copy; monotal</p>
                </div>
            </div>
        </div>
    </footer>
