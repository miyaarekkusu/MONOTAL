{% extends "base.html" %}
{% load static %}

{% block title %}掲示板を作成 - MONOTAL{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/community.css' %}">
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

    <!-- パンくずリスト -->
    <div class="flex items-center gap-2 text-sm text-zinc-400 mb-6">
        <a href="{% url 'community' %}" class="hover:text-zinc-600 transition-colors">コミュニティ</a>
        <span class="iconify" data-icon="lucide:chevron-right" data-width="14"></span>
        <a href="{% url 'board_list' %}" class="hover:text-zinc-600 transition-colors">掲示板一覧</a>
        <span class="iconify" data-icon="lucide:chevron-right" data-width="14"></span>
        <span>新規作成</span>
    </div>

    <div class="bg-white border border-zinc-200 rounded-2xl p-6 sm:p-8">
        <h1 class="text-xl font-bold text-zinc-900 mb-1">掲示板を作成</h1>
        <p class="text-sm text-zinc-500 mb-6">テーマを決めて、みんなと語り合いましょう。</p>

        <!-- 共通エラー -->
        <div id="error-general" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600"></div>

        <form id="board-create-form" novalidate>

            <!-- タイトル -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-1.5">
                    <label for="name" class="text-sm font-semibold text-zinc-700">
                        タイトル <span class="text-red-500">*</span>
                    </label>
                    <span id="name-counter" class="text-xs text-zinc-400">0 / 100</span>
                </div>
                <input type="text" id="name" maxlength="100"
                       placeholder="掲示板のタイトル（例：おすすめの機材について語ろう）"
                       class="w-full px-4 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition"
                       autocomplete="off">
                <p id="error-name" class="mt-1 text-xs text-red-500 hidden"></p>
            </div>

            <!-- カテゴリ -->
            <div class="mb-5">
                <label for="category" class="block text-sm font-semibold text-zinc-700 mb-1.5">
                    カテゴリ <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <select id="category"
                            class="w-full px-4 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition appearance-none bg-white">
                        <option value="">カテゴリを選択してください</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <span class="iconify absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none" data-icon="lucide:chevron-down" data-width="16"></span>
                </div>
                <p id="error-category" class="mt-1 text-xs text-red-500 hidden"></p>
            </div>

            <!-- 説明文 -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-1.5">
                    <label for="description" class="text-sm font-semibold text-zinc-700">
                        説明文 <span class="text-red-500">*</span>
                    </label>
                    <span id="desc-counter" class="text-xs text-zinc-400">0 / 1000</span>
                </div>
                <textarea id="description" rows="5" maxlength="1000"
                          placeholder="この掲示板の目的やルールなどを分かりやすく入力してください。"
                          class="w-full px-4 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition resize-none"></textarea>
                <p id="error-description" class="mt-1 text-xs text-red-500 hidden"></p>
            </div>

            <!-- 送信ボタン -->
            <div class="flex items-center gap-3">
                <button type="submit" id="submit-btn"
                        class="flex-1 flex items-center justify-center gap-2 py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                    <span class="iconify" data-icon="lucide:plus-circle" data-width="18"></span>
                    <span id="submit-label">掲示板を作成する</span>
                </button>
                <a href="{% url 'board_list' %}"
                   class="px-5 py-3 border border-zinc-200 text-zinc-600 hover:bg-zinc-50 font-semibold rounded-xl transition-colors text-sm">
                    キャンセル
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    // ===== 文字数カウンター =====
    function initCounter(inputId, counterId, max) {
        const el = document.getElementById(inputId);
        const counter = document.getElementById(counterId);
        if (!el || !counter) return;
        const update = () => {
            const len = el.value.length;
            counter.textContent = len + ' / ' + max;
            counter.classList.toggle('text-red-500', len > max * 0.9);
        };
        el.addEventListener('input', update);
        update();
    }
    initCounter('name', 'name-counter', 100);
    initCounter('description', 'desc-counter', 1000);

    // ===== CSRFトークン取得 =====
    function getCsrfToken() {
        const m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? m[1] : '';
    }

    // ===== エラー表示 =====
    function showFieldError(fieldId, message) {
        const el = document.getElementById('error-' + fieldId);
        if (!el) return;
        el.textContent = message;
        el.classList.remove('hidden');
        // 対応する input/select/textarea にエラースタイル
        const input = document.getElementById(fieldId);
        if (input) input.classList.add('border-red-400', 'ring-red-300');
    }

    function clearErrors() {
        ['name', 'category', 'description', 'general'].forEach(id => {
            const el = document.getElementById('error-' + id);
            if (el) { el.textContent = ''; el.classList.add('hidden'); }
        });
        ['name', 'category', 'description'].forEach(id => {
            const input = document.getElementById(id);
            if (input) input.classList.remove('border-red-400', 'ring-red-300');
        });
    }

    function showGeneralError(msg) {
        const el = document.getElementById('error-general');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    // ===== フロントバリデーション =====
    function validate() {
        const name = document.getElementById('name').value.trim();
        const description = document.getElementById('description').value.trim();
        const category = document.getElementById('category').value;
        const errors = {};
        if (!name) errors.name = 'タイトルは必須です';
        else if (name.length > 100) errors.name = 'タイトルは100文字以内で入力してください';
        if (!description) errors.description = '説明文は必須です';
        else if (description.length > 1000) errors.description = '説明文は1000文字以内で入力してください';
        if (!category) errors.category = 'カテゴリを選択してください';
        return errors;
    }

    // ===== フォーム送信 =====
    const form = document.getElementById('board-create-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        // フロントバリデーション
        const errors = validate();
        if (Object.keys(errors).length > 0) {
            Object.entries(errors).forEach(([k, v]) => showFieldError(k, v));
            return;
        }

        // 送信中
        submitBtn.disabled = true;
        submitLabel.textContent = '作成中...';

        try {
            const response = await fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({
                    name: document.getElementById('name').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    category_id: document.getElementById('category').value,
                }),
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirect_url;
            } else if (data.errors) {
                Object.entries(data.errors).forEach(([k, v]) => showFieldError(k, v));
            } else {
                showGeneralError(data.message || 'エラーが発生しました');
            }
        } catch (err) {
            showGeneralError('通信エラーが発生しました。再度お試しください。');
        } finally {
            submitBtn.disabled = false;
            submitLabel.textContent = '掲示板を作成する';
        }
    });

    // リアルタイムエラークリア
    ['name', 'category', 'description'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', () => {
            const errEl = document.getElementById('error-' + id);
            if (errEl) { errEl.textContent = ''; errEl.classList.add('hidden'); }
            el.classList.remove('border-red-400', 'ring-red-300');
        });
    });
})();
</script>
{% endblock %}
