<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理者パネル{% endblock %} | MONOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 20px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen flex flex-col">

    <!-- Admin Header -->
    <header class="sticky top-0 z-50 w-full border-b border-zinc-200 bg-white/95 backdrop-blur-md">
        <div class="mx-auto flex h-14 max-w-[1200px] items-center justify-between px-4 lg:px-6">
            <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-2 group">
                <span class="iconify text-pink-600" data-icon="lucide:box-select" data-width="22"></span>
                <span class="text-lg font-bold tracking-tight text-zinc-900 uppercase group-hover:text-pink-600 transition-colors">MONOTAL</span>
            </a>
            <span class="text-sm font-semibold text-zinc-500 tracking-wide">管理者画面</span>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 mx-auto w-full max-w-[1200px] px-4 lg:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

    <!-- Custom Modal Dialog -->
    <div id="customAlertModal" class="fixed inset-0 z-[100] hidden">
        <div id="customModalBackdrop" class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="fixed inset-0 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4">
                <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl">
                    <div class="p-6 space-y-4">
                        <h3 id="customModalTitle" class="text-lg font-bold text-zinc-900 hidden"></h3>
                        <p id="customModalMessage" class="text-sm text-zinc-600 whitespace-pre-line"></p>
                        <div id="customModalAlertBtn" class="pt-2">
                            <button type="button" id="customModalOkBtn"
                                class="w-full px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors bg-pink-600 text-white hover:bg-pink-700">
                                OK
                            </button>
                        </div>
                        <div id="customModalConfirmBtns" class="flex gap-3 pt-2 hidden">
                            <button type="button" id="customModalCancelBtn"
                                class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors bg-zinc-100 text-zinc-700 hover:bg-zinc-200">
                                キャンセル
                            </button>
                            <button type="button" id="customModalConfirmBtn"
                                class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors bg-pink-600 text-white hover:bg-pink-700">
                                確認
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% load static %}
    <script src="{% static 'js/modal.js' %}"></script>
</body>
</html>
